<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Database Explorer</title>
    <link rel="stylesheet" href="/monitoring-ui/Application/style-test.css" >
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container-fluid mt-3">
    <div class="d-flex align-items-center justify-content-between gap-3">

        <!-- Left: Application Monitoring -->
        <div class="title_box flex-grow-1">
            <span class="title">🚀 Application Monitoring</span>
            <p class="page-subtitle">
                Real-time application health, runtime metrics and diagnostics
            </p>
        </div>

        <!-- Right: Refresh Status -->
        <div class="refresh-status title_box">
            <span id="live-indicator" class="live-dot"></span>
            <span id="refresh-status">Live</span>
            <span class="refresh-time">
                    Updated: <span id="last-updated">-</span>
                </span>
        </div>

    </div>
</div>

<script src="/monitoring-ui/Application/app.js"></script>

</body>

</html>
