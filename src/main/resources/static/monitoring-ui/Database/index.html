<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Database Explorer</title>
    <link rel="stylesheet" href="/monitoring-ui/Database/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="title_box">
    <span class="title">Database/Schema List</span>
</div>
<div class="content_box">
    <div class="page">


        <!-- Header -->
        <header>
            <h1>
                Database Explorer
            </h1>
        </header>



        <!-- Database Summary -->

        <section id="database-summary">

            <div class="database-card">

                <div class="database-header">
                    🗄 Database Explorer
                </div>


                <div class="database-info">

                    <div class="info-box">
                        <span class="label">Database</span>
                        <span id="database-name"></span>
                    </div>



                    <div class="info-box">
                        <span class="label">Version</span>
                        <span id="database-version"></span>
                    </div>


                    <div class="info-box">
                        <span class="label">Driver</span>
                        <span id="database-driver"></span>
                    </div>


                    <div class="info-box">
                        <span class="label">Connection</span>
                        <span id="database-url"></span>
                    </div>


                    <div class="info-box">
                        <span class="label">Schemas</span>
                        <span id="schema-count"></span>
                    </div>

                </div>

            </div>

        </section>



        <!-- Schema Area -->

        <section>

            <h2>
                Schemas
            </h2>


            <div id="schema-container">

            </div>


        </section>



    </div>




</div>
<script src="/monitoring-ui/Database/app.js"></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
